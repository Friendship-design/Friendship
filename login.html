<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Friendship</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f8ff;color:#17324d}a{text-decoration:none;color:inherit}header{background:#fff;border-bottom:1px solid #d9e6f4;position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:10px}.brand{font-size:23px;font-weight:900;color:#1769e0;margin-right:auto;display:flex;align-items:center;gap:8px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1769e0,#61c5ff);display:inline-block;position:relative}.logo:after{content:"";position:absolute;width:22px;height:10px;border-radius:12px;background:#fff;left:8px;bottom:7px}.logo:before{content:"• • •";position:absolute;color:#fff;font-size:15px;letter-spacing:2px;left:7px;top:3px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer;display:inline-block}.blue{background:linear-gradient(135deg,#1769e0,#43a8ff);color:#fff}.light{background:#edf6ff;color:#1769e0}.red{background:#ffecef;color:#b52346}.wrap{max-width:1100px;margin:auto;padding:22px 18px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center;padding:45px 0}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.02;margin:8px 0 18px}.hero p,.muted{color:#6b7b8d;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap}.visual{min-height:310px;border-radius:28px;background:linear-gradient(135deg,#e1f1ff,#fff0f7);display:grid;place-items:center}.visual svg{width:90%;max-width:430px}.section{padding:50px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce8f5;border-radius:20px;padding:22px;box-shadow:0 8px 25px #1a5a8c12}.authbg{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eaf5ff,#fff3f8)}.auth{width:min(450px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 35px #123e6b20}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #cbd9e8;border-radius:10px;font-size:16px}.msg{display:none;padding:12px;border-radius:10px;background:#fff0f3;color:#b52346;margin:12px 0}.ok{background:#ecfff4;color:#13753e}.cover{background:linear-gradient(135deg,#1262d6,#65c6ff);color:#fff;border-radius:22px;padding:28px}.avatar{width:82px;height:82px;border-radius:50%;background:#fff;color:#1769e0;display:grid;place-items:center;font-size:38px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}.post{background:#fff;border:1px solid #dce8f5;border-radius:18px;padding:18px;margin-bottom:15px}.post textarea{width:100%;min-height:100px;border:1px solid #ccdbea;border-radius:12px;padding:12px;font-family:inherit}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}footer{background:#0b315e;color:#dcecff;text-align:center;padding:30px;margin-top:30px}@media(max-width:800px){.hero,.grid2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.bar{flex-wrap:wrap}}</style></head><body><div class="authbg"><div class="auth"><a href="index.html" style="color:#1769e0;font-weight:800">← Kembali</a><h1>Login Friendship</h1><p class="muted">Masuk ke akun Anda.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button id="submit" class="btn blue" style="width:100%" type="submit">LOGIN</button></form><p class="muted">Belum punya akun? <a href="register.html" style="color:#1769e0;font-weight:800">Register</a></p></div></div><script>const SB_URL='https://bqqrrmboyczgojkqgkcf.supabase.co',SB_KEY='sb_publishable_R8yoexRqOov7Y0OEwhsRLw_SfLj5N6g';
const headers=()=>({'apikey':SB_KEY,'Content-Type':'application/json'});
const token=()=>localStorage.getItem('friendship_access_token')||'';
const authHeaders=()=>({'apikey':SB_KEY,'Authorization':'Bearer '+token(),'Content-Type':'application/json'});
async function api(path,opt={}){let h=opt.headers||authHeaders();let r=await fetch(SB_URL+path,{...opt,headers:h});let t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||d?.error||('HTTP '+r.status));return d}
async function signup(email,password,full_name,username){return api('/auth/v1/signup',{method:'POST',headers:headers(),body:JSON.stringify({email,password,data:{full_name,username}})})}
async function login(email,password){return api('/auth/v1/token?grant_type=password',{method:'POST',headers:headers(),body:JSON.stringify({email,password})})}
function saveSession(d){if(d?.access_token)localStorage.setItem('friendship_access_token',d.access_token);if(d?.refresh_token)localStorage.setItem('friendship_refresh_token',d.refresh_token);if(d?.user)localStorage.setItem('friendship_user',JSON.stringify(d.user))}
function user(){try{return JSON.parse(localStorage.getItem('friendship_user')||'null')}catch{return null}}
function logout(){localStorage.removeItem('friendship_access_token');localStorage.removeItem('friendship_refresh_token');localStorage.removeItem('friendship_user');location.href='index.html'}const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='MEMPROSES...';m.style.display='none';try{let d=await login(document.getElementById('email').value.trim(),document.getElementById('password').value);saveSession(d);location.href='dashboard.html'}catch(e){m.textContent='Login gagal: '+e.message;m.style.display='block'}finally{b.disabled=false;b.textContent='LOGIN'}});</script></body></html>
