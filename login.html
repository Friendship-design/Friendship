<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Friendship</title><link rel="stylesheet" href="css/style.css"><script src="js/supabase-config.js"></script><script>
async function loadSupabase(){
  if(window.supabaseClient) return window.supabaseClient;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  document.head.appendChild(s);
  await new Promise((res,rej)=>{s.onload=res;s.onerror=rej});
  window.supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
  return window.supabaseClient;
}
</script></head><body><div class="authwrap"><div class="auth"><a class="back" href="index.html">← Kembali ke Friendship</a><h1>Login</h1><p class="lead">Masuk ke akun Friendship Anda.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%">Masuk</button></form><p class="lead">Belum punya akun? <a href="register.html" style="color:#1769e0;font-weight:800">Register</a></p></div></div><script>
const form=document.getElementById('form'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';try{const sb=await loadSupabase();const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;location.href='dashboard.html';}catch(err){msg.textContent=err.message||'Login gagal';msg.style.display='block';}});
</script></body></html>
