<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="top"><div class="bar"><a class="brand" href="../index.html">friend<span>ship</span></a></div></header><main class="container"><div class="card form-card"><h1>Login Friendship</h1><div id="msg"></div><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Masuk</button><p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>async function login(){const msg=document.getElementById('msg');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}location.href='../index.html'}window.login=login;</script></body></html>
