<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body class="authpage"><div class="auth"><div class="authhead"><div class="authbrand">Friend<b>ship</b></div><div>Connect • Share • Remember 🌈</div></div><div class="authbody"><h2>Welcome Back!</h2><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Log In</button></form><div id="msg" class="msg"></div><div class="small">New to Friendship? <a href="register.html">Create an account</a></div></div></div><script type="module">import{supabase}from'../js/supabase-config.js';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();msg.textContent='Logging in...';const{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else location.href='../index.html'}</script></body></html>
