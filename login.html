<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Friendster</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="auth"><div class="auth-box"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="Friendster"></a><h2 class="center">Selamat datang kembali 👋</h2><p class="sub center">Masuk ke akun Friendster kamu.</p><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn btn-primary" style="width:100%;margin-top:18px">LOGIN</button><div id="msg" class="msg"></div></form><p class="center">Belum punya akun? <a href="register.html" style="color:#2673ee;font-weight:800">Daftar sekarang</a></p></div></main><script type="module">import{supabase}from'../js/supabase-config.js';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();msg.textContent='Memproses...';let{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.href='dashboard.html'};</script></body></html>
