<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk - Friendship Ebenhaezer</title><style>body{margin:0;font-family:Arial;background:#f3f6fb;display:grid;place-items:center;min-height:100vh}.card{background:#fff;width:min(420px,92%);padding:28px;border-radius:22px;text-align:center;box-shadow:0 10px 35px #12305a14}.logo{width:110px;height:110px;object-fit:contain}input,button{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #dbe2ec;box-sizing:border-box}button{background:#1264d9;color:#fff;border:0;font-weight:700}a{color:#1264d9;font-weight:700}</style></head><body><div class="card"><img class="logo" src="logo.png"><h1>Friendship Ebenhaezer</h1><p>Masuk ke akunmu</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Kata sandi"><button onclick="login()">Masuk</button><p id="msg"></p><p>Belum punya akun? <a href="register.html">Daftar</a></p></div><script>const A='https://bqqrrmboyczgojkqgkcf.supabase.co',K='sb_publishable_R8yoexRqOov7Y0OEwhsRLw_SfLj5N6g';async function login(){const m=document.getElementById('msg');m.textContent='Memproses...';try{const r=await fetch(A+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.msg||'Email atau kata sandi tidak sesuai');localStorage.setItem('friendship_access_token',d.access_token);localStorage.setItem('friendship_refresh_token',d.refresh_token||'');localStorage.setItem('friendship_user',JSON.stringify(d.user));location.href='index.html'}catch(e){m.textContent=e.message}}</script></body></html>
