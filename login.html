<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth"><div class="authbox"><img src="../assets/logo.svg"><h2 class="center">Selamat datang kembali</h2><form id="f"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn primary" style="width:100%;margin-top:18px">LOGIN</button><div id="msg" class="msg"></div></form><p class="center">Belum punya akun? <a href="register.html" style="color:#176fe8;font-weight:700">Register</a></p></div><script type="module">import{supabase}from'../js/supabase-config.js';f.onsubmit=async e=>{e.preventDefault();msg.textContent='Memproses...';let{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}location.href='dashboard.html'}</script></body></html>
