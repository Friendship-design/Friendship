<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="auth-wrap"><div class="auth"><div class="auth-logo">Friend<span>ship</span> 🌈</div><h1>Selamat Datang! 👋</h1><p style="text-align:center">Masuk untuk bertemu teman dan berbagi momen.</p><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Login ✨</button></form><div class="msg" id="msg"></div><div class="switch">Belum punya akun? <a href="register.html">Daftar sekarang</a></div></div></div><script type="module">import{supabase}from'../js/supabase-config.js';form.onsubmit=async e=>{e.preventDefault();msg.textContent='Memproses...';const{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else location.href='../index.html'};</script></body></html>
