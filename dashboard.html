<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Friendship</title><link rel="stylesheet" href="css/style.css"><script src="js/supabase-config.js"></script><script>
async function loadSupabase(){
  if(window.supabaseClient) return window.supabaseClient;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  document.head.appendChild(s);
  await new Promise((res,rej)=>{s.onload=res;s.onerror=rej});
  window.supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
  return window.supabaseClient;
}
</script></head><body><header class="nav"><div class="navin"><a class="brand" href="dashboard.html"><span class="mark"></span>Friendship</a><a class="btn danger logout" id="logout" href="#">Keluar</a></div></header><main class="dashboard"><section class="cover"><div class="avatar">🙂</div><h1 id="welcome">Friendship</h1><p>Profil dan komunitas Anda.</p></section><div class="dashgrid"><div><div class="post"><h2>Bagikan sesuatu</h2><p class="lead">Dashboard dasar sudah aktif. Fitur posting dapat dikembangkan berikutnya.</p></div><div class="post"><h2>Selamat datang 👋</h2><p class="lead">Anda berhasil masuk ke Friendship.</p></div></div><aside class="post"><h3>Menu</h3><p><a href="#">Profil</a></p><p><a href="#">Teman</a></p><p><a href="#">Pesan</a></p></aside></div></main><script>
(async()=>{try{const sb=await loadSupabase();const {data}=await sb.auth.getUser();if(!data.user){location.href='login.html';return};document.getElementById('welcome').textContent='Halo, '+(data.user.user_metadata?.full_name||data.user.email||'Teman')+'!';document.getElementById('logout').onclick=async e=>{e.preventDefault();await sb.auth.signOut();location.href='index.html';};}catch(e){location.href='login.html';}})();
</script></body></html>
