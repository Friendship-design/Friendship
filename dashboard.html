<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendship Home</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="appbar"><div class="wrap appnav"><a href="#"><img src="../assets/logo.svg"></a><div><a href="dashboard.html">Home</a><a href="#">Friends</a><a href="#">Messages</a><button id="out" class="btn" style="margin-left:12px;background:#fff;color:#176fe8">Keluar</button></div></div></header><main class="dashboard"><div class="wrap dashgrid"><aside><div class="panel"><div class="cover"><div class="avatar">😊</div></div><div class="profile"><h3 id="name">Member</h3><span class="pill">Friendship Member</span><p class="sub">Connect • Share • Remember</p></div></div></aside><section><div class="panel"><h2>Selamat datang 👋</h2><p class="sub">Ini beranda Friendship kamu.</p><textarea rows="3" placeholder="Apa yang ingin kamu bagikan?"></textarea><br><button class="btn primary" style="margin-top:10px">Post Update</button></div><div class="panel"><h3>Friendship Feed</h3><div class="post"><b>Friendship Community</b><p class="sub">Selamat datang di Friendship V5.</p></div></div></section><aside><div class="panel"><h3>✨ Saran</h3><p class="sub">Lengkapi profil dan mulai tambahkan teman.</p></div></aside></div></main><script type="module">import{supabase}from'../js/supabase-config.js';let{data:{user}}=await supabase.auth.getUser();if(!user)location.href='login.html';else name.textContent=user.user_metadata?.full_name||user.email?.split('@')[0]||'Member';out.onclick=async()=>{await supabase.auth.signOut();location.href='../index.html'}</script></body></html>
