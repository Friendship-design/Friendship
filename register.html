<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="top"><div class="bar"><a class="brand" href="../index.html">friend<span>ship</span></a></div></header><main class="container"><div class="card form-card"><h1>Buat Akun Friendship</h1><p class="muted">Bergabung dan temukan teman.</p><div id="msg"></div><label>Nama lengkap</label><input id="name" autocomplete="name"><label>Email</label><input id="email" type="email" autocomplete="email"><label>Password</label><input id="password" type="password" autocomplete="new-password"><button class="btn" onclick="register()">Daftar</button><p>Sudah punya akun? <a href="login.html">Login</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>async function register(){const msg=document.getElementById('msg');msg.innerHTML='';const full_name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!full_name||!email||password.length<6){msg.innerHTML='<div class="error">Isi semua data. Password minimal 6 karakter.</div>';return}const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name}}});if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}if(data.session){location.href='../index.html'}else{msg.innerHTML='<div class="success">Pendaftaran berhasil. Silakan cek email jika konfirmasi email diaktifkan.</div>'}}window.register=register;</script></body></html>
