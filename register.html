<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - Friendship</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#263247}
a{text-decoration:none}.top{background:linear-gradient(135deg,#3159d8,#7048d8);color:#fff;padding:16px 20px;box-shadow:0 3px 12px #0002}
.bar{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-size:28px;font-weight:800;letter-spacing:.5px}
.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{border:0;border-radius:20px;padding:9px 15px;background:#ffffff20;color:#fff;font-weight:700;cursor:pointer}
.wrap{max-width:1050px;margin:25px auto;padding:0 15px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 25px #18335b14;margin-bottom:18px}
.authbg{min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8f2ff);display:flex;align-items:center;justify-content:center;padding:20px}
.auth{width:100%;max-width:460px;background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px #18335b22}.auth h1{text-align:center;margin:0 0 7px}.sub{text-align:center;color:#6b7485;margin-bottom:22px}
label{display:block;font-weight:700;margin:13px 0 7px}input,textarea{width:100%;padding:13px 14px;border:1px solid #d7ddea;border-radius:12px;font-size:15px;outline:none}input:focus,textarea:focus{border-color:#5b5bd6}
.btn{border:0;border-radius:12px;padding:13px 18px;background:#4f55d8;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.full{width:100%;margin-top:18px}
.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#ffe9e9;color:#a12828;line-height:1.45}.ok{background:#e9f9ef;color:#176b39}
.muted{color:#70798a}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.cover{min-height:260px;border-radius:18px;background:linear-gradient(135deg,#3e61d8,#a54ed7);color:#fff;padding:28px;display:flex;flex-direction:column;justify-content:center}.cover h1{font-size:42px;margin:0 0 10px}.cover p{font-size:17px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.post{padding:16px;border:1px solid #e2e6ef;border-radius:14px;margin-bottom:12px;background:#fff}.status{padding:12px 14px;border-radius:12px;background:#f0f3ff;margin-top:12px;font-size:14px}.status.good{background:#eaf9ef;color:#176b39}.status.warn{background:#fff5dd;color:#805b00}
@media(max-width:720px){.hero,.grid2{grid-template-columns:1fr}.cover h1{font-size:34px}.bar{align-items:flex-start}.logo{font-size:24px}}
</style></head>
<body><div class="authbg"><div class="auth"><h1>Buat Akun</h1><div class="sub">Bergabung dengan Friendship</div>
<form id="form"><label>Nama lengkap</label><input id="name" required autocomplete="name"><label>Nama pengguna</label><input id="username" required autocomplete="username"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" minlength="6" required autocomplete="new-password"><button id="submit" class="btn full">DAFTAR</button></form>
<div id="msg" class="msg"></div><p class="muted" style="text-align:center;margin-top:20px">Sudah punya akun? <a href="login.html">Masuk di sini</a></p></div></div>
<script>
const APP_URL='https://bqqrrmboyczgojkqgkcf.supabase.co', APP_KEY='sb_publishable_R8yoexRqOov7Y0OEwhsRLw_SfLj5N6g';
const token=()=>localStorage.getItem('friendship_access_token')||'';
const headers=()=>({'apikey':APP_KEY,'Content-Type':'application/json'});
const authHeaders=()=>({'apikey':APP_KEY,'Authorization':'Bearer '+token(),'Content-Type':'application/json'});
async function api(path,opt={}){
  const h=opt.headers||authHeaders();
  const r=await fetch(APP_URL+path,{...opt,headers:h});
  const t=await r.text(); let d;
  try{d=t?JSON.parse(t):null}catch{d=t}
  if(!r.ok) throw new Error(d?.msg||d?.message||d?.error_description||d?.error||('Terjadi kesalahan ('+r.status+')'));
  return d;
}
async function signup(email,password,full_name,username){
 return api('/auth/v1/signup',{method:'POST',headers:headers(),body:JSON.stringify({email,password,data:{full_name,username}})});
}
async function login(email,password){
 return api('/auth/v1/token?grant_type=password',{method:'POST',headers:headers(),body:JSON.stringify({email,password})});
}
function saveSession(d){
 if(d?.access_token)localStorage.setItem('friendship_access_token',d.access_token);
 if(d?.refresh_token)localStorage.setItem('friendship_refresh_token',d.refresh_token);
 if(d?.user)localStorage.setItem('friendship_user',JSON.stringify(d.user));
}
function currentUser(){try{return JSON.parse(localStorage.getItem('friendship_user')||'null')}catch{return null}}
function logout(){localStorage.removeItem('friendship_access_token');localStorage.removeItem('friendship_refresh_token');localStorage.removeItem('friendship_user');location.href='index.html'}

const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('submit');
f.addEventListener('submit',async e=>{
 e.preventDefault();b.disabled=true;b.textContent='MEMPROSES...';m.style.display='none';
 try{
  const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
  if(password.length<6)throw Error('Password minimal 6 karakter.');
  const d=await signup(email,password,name,username);
  if(d?.access_token){saveSession(d);location.href='dashboard.html';return}
  m.className='msg ok';m.innerHTML='Akun berhasil dibuat. Silakan masuk untuk melanjutkan.<br><br><a class="btn" href="login.html" style="display:inline-block">MASUK SEKARANG</a>';m.style.display='block';f.reset();
 }catch(e){m.className='msg';m.textContent='Pendaftaran gagal: '+e.message;m.style.display='block'}
 finally{b.disabled=false;b.textContent='DAFTAR'}
});
</script></body></html>
