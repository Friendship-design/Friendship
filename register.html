<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body class="authpage"><div class="auth"><div class="authhead"><div class="authbrand">Friend<b>ship</b></div><div>Join the colourful community 🌈</div></div><div class="authbody"><h2>Create Your Account</h2><form id="form"><input id="name" placeholder="Full name" required><input id="username" placeholder="Username" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" minlength="6" placeholder="Password" required><button class="btn">Register</button></form><div id="msg" class="msg"></div><div class="small">Already a member? <a href="login.html">Log in</a></div></div></div><script type="module">import{supabase}from'../js/supabase-config.js';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();msg.textContent='Creating account...';const{data,error}=await supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value,username:username.value}}});if(error)msg.textContent=error.message;else if(data.session)location.href='../index.html';else msg.textContent='Account created. Please log in. 😊'}</script></body></html>
