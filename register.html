<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - Friendship Forever</title><style>body{margin:0;font-family:Arial;background:#f3f6fb;display:grid;place-items:center;min-height:100vh}.card{background:#fff;width:min(420px,92%);padding:28px;border-radius:22px;text-align:center;box-shadow:0 10px 35px #12305a14}.logo{width:110px;height:110px;object-fit:contain}input,button{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid #dbe2ec;box-sizing:border-box}button{background:#1264d9;color:#fff;border:0;font-weight:700}a{color:#1264d9;font-weight:700}</style></head><body><div class="card"><img class="logo" src="logo.png"><h1>Friendship Forever</h1><p>Buat akun baru</p><input id="name" placeholder="Nama lengkap"><input id="username" placeholder="Username"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Kata sandi"><button id="submitBtn">Daftar</button><p id="msg"></p><p>Sudah punya akun? <a href="login.html">Masuk</a></p></div><script>const A='https://bqqrrmboyczgojkqgkcf.supabase.co',K='sb_publishable_R8yoexRqOov7Y0OEwhsRLw_SfLj5N6g';async function reg(){const m=document.getElementById('msg');m.textContent='Memproses...';try{const r=await fetch(A+'/auth/v1/signup',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,data:{full_name:name.value,username:username.value}})});const d=await r.json();if(!r.ok)throw Error(d.msg||'Pendaftaran gagal');m.innerHTML='Pendaftaran berhasil. <a href="login.html">Masuk sekarang</a>'}catch(e){m.textContent=e.message}}document.getElementById('submitBtn').addEventListener('click',reg);</script></body></html>
