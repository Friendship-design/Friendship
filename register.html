<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth"><div class="authbox"><img src="../assets/logo.svg"><h2 class="center">Buat akun Friendship</h2><form id="f"><label>Nama lengkap</label><input id="full" required><label>Username</label><input id="user" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button class="btn primary" style="width:100%;margin-top:18px">REGISTER</button><div id="msg" class="msg"></div></form><p class="center">Sudah punya akun? <a href="login.html" style="color:#176fe8;font-weight:700">Login</a></p></div><script type="module">import{supabase}from'../js/supabase-config.js';f.onsubmit=async e=>{e.preventDefault();msg.textContent='Membuat akun...';let{data,error}=await supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:full.value,username:user.value}}});if(error){msg.textContent=error.message;return}if(data.session)location.href='dashboard.html';else{msg.style.color='#198754';msg.textContent='Pendaftaran berhasil. Silakan login.';setTimeout(()=>location.href='login.html',900)}};</script></body></html>
