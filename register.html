<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — Friendster</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="auth"><div class="auth-box"><a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="Friendster"></a><h2 class="center">Buat akun Friendster ✨</h2><p class="sub center">Daftar dan mulai membangun jaringanmu.</p><form id="form"><label>Nama lengkap</label><input id="full_name" required><label>Username</label><input id="username" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button class="btn btn-pink" style="width:100%;margin-top:18px">REGISTER</button><div id="msg" class="msg"></div></form><p class="center">Sudah punya akun? <a href="login.html" style="color:#2673ee;font-weight:800">Login</a></p></div></main><script type="module">import{supabase}from'../js/supabase-config.js';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();msg.textContent='Membuat akun...';let{data,error}=await supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:full_name.value,username:username.value}}});if(error){msg.textContent=error.message;return}if(data.session)location.href='dashboard.html';else{msg.style.color='#17844b';msg.textContent='Pendaftaran berhasil. Silakan login.';setTimeout(()=>location.href='login.html',1000)}};</script></body></html>
