<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar — Friendship</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="auth-wrap"><div class="auth"><div class="auth-logo">Friend<span>ship</span> 🌈</div><h1>Buat Akun 🎉</h1><p style="text-align:center">Bergabung dengan komunitas Friendship.</p><form id="form"><input id="name" placeholder="Nama lengkap" required><input id="username" placeholder="Username" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (min. 6 karakter)" minlength="6" required><button class="btn">Daftar ✨</button></form><div class="msg" id="msg"></div><div class="switch">Sudah punya akun? <a href="login.html">Login</a></div></div></div><script type="module">import{supabase}from'../js/supabase-config.js';form.onsubmit=async e=>{e.preventDefault();msg.textContent='Membuat akun...';const{data,error}=await supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value,username:username.value}}});if(error)msg.textContent=error.message;else if(data.session)location.href='../index.html';else msg.textContent='Akun berhasil dibuat. Silakan login. 😊'};</script></body></html>
