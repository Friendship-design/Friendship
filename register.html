<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — Friendship</title><link rel="stylesheet" href="css/style.css"><script src="js/supabase-config.js"></script><script>
async function loadSupabase(){
  if(window.supabaseClient) return window.supabaseClient;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  document.head.appendChild(s);
  await new Promise((res,rej)=>{s.onload=res;s.onerror=rej});
  window.supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
  return window.supabaseClient;
}
</script></head><body><div class="authwrap"><div class="auth"><a class="back" href="index.html">← Kembali ke Friendship</a><h1>Daftar Friendship</h1><p class="lead">Buat akun baru untuk bergabung.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Nama lengkap</label><input id="name" required></div><div class="field"><label>Username</label><input id="username" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><button class="btn primary" style="width:100%">Daftar</button></form><p class="lead">Sudah punya akun? <a href="login.html" style="color:#1769e0;font-weight:800">Login</a></p></div></div><script>
const form=document.getElementById('form'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';try{const sb=await loadSupabase();const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,username}}});if(error)throw error;if(data.session) location.href='dashboard.html'; else {msg.className='msg ok';msg.textContent='Pendaftaran berhasil. Silakan login.';msg.style.display='block';setTimeout(()=>location.href='login.html',900);}}catch(err){msg.textContent=err.message||'Pendaftaran gagal';msg.style.display='block';}});
</script></body></html>
