<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendship Ebenhaezer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6fb;color:#182033}header{position:sticky;top:0;background:white;border-bottom:1px solid #ddd;padding:12px;z-index:5}.bar{max-width:1050px;margin:auto;display:flex;gap:7px;align-items:center;overflow:auto}.brand{font-size:21px;font-weight:800;color:#2563eb;margin-right:auto;white-space:nowrap}button{border:0;border-radius:12px;padding:10px 13px;background:#edf2ff;color:#2458d6;font-weight:700;white-space:nowrap}.primary{background:#2563eb;color:white}.wrap{max-width:900px;margin:18px auto;padding:0 14px}.card{background:white;border:1px solid #e4e8ef;border-radius:18px;padding:17px;margin-bottom:14px}textarea,input{width:100%;padding:12px;border:1px solid #dbe2ed;border-radius:12px;font:inherit;margin:5px 0}textarea{min-height:90px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.hidden{display:none!important}.reel{background:#000;border-radius:18px;overflow:hidden;color:#fff}.reel video{width:100%;max-height:75vh;display:block} .muted{color:#6b7280}</style></head><body><header><div class="bar"><div class="brand">Friendship Ebenhaezer</div><button onclick="page('home')">Beranda</button><button onclick="page('reels')">🎬 Reels</button><button onclick="page('friends')">Teman</button><button onclick="page('groups')">Grup</button><button onclick="page('profile')">Profil</button></div></header><main class="wrap"><section id="home"><div class="card"><h2>Buat Postingan</h2><textarea id="txt" placeholder="Apa yang ingin kamu bagikan?"></textarea><input id="photo" type="file" accept="image/*"><div class="actions"><button class="primary" onclick="post()">Bagikan</button></div></div><div id="feed"></div></section><section id="reels" class="hidden"><div class="card"><h2>🎬 Reels</h2><p class="muted">Pilih video pendek untuk Reels.</p><input id="vid" type="file" accept="video/*"><button class="primary" onclick="makeReel()">Bagikan Reels</button></div><div id="reelList"></div></section><section id="friends" class="hidden"><div class="card"><h2>Temukan Teman</h2><input placeholder="Cari nama atau username"><p class="muted">Daftar teman akan muncul di sini.</p></div></section><section id="groups" class="hidden"><div class="card"><h2>👥 Grup</h2><input placeholder="Nama grup"><textarea placeholder="Deskripsi grup"></textarea><button class="primary" onclick="alert('Grup dibuat')">Buat Grup</button></div></section><section id="profile" class="hidden"><div class="card"><h2>Profil</h2><p>Friendship Ebenhaezer</p><p class="muted">Alamat email tidak ditampilkan di profil.</p></div></section></main><script>function page(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function safe(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function post(){let t=document.getElementById('txt').value.trim();if(!t){alert('Tulis postingan terlebih dahulu.');return}let d=document.createElement('div');d.className='card';d.innerHTML='<b>Anggota Friendship Ebenhaezer</b><p>'+safe(t)+'</p><button>❤️ Suka</button><button>💬 Komentar</button><button>↗️ Bagikan</button>';document.getElementById('feed').prepend(d);document.getElementById('txt').value=''}function makeReel(){let f=document.getElementById('vid').files[0];if(!f){alert('Pilih video terlebih dahulu.');return}let url=URL.createObjectURL(f);let d=document.createElement('div');d.className='card reel';d.innerHTML='<video src="'+url+'" controls autoplay muted loop playsinline></video><div style="padding:12px"><b>Reels Friendship Ebenhaezer</b><p>'+safe(f.name)+'</p>❤️ Suka &nbsp; 💬 Komentar &nbsp; ↗️ Bagikan</div>';document.getElementById('reelList').prepend(d)}</script></body></html>
